<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>수면 패턴 분석</title>
<style>
:root{
  --bg:#0f1226;--card:#191d3a;--card2:#222749;--text:#eef0ff;--muted:#9aa0c8;
  --accent:#7c8cff;--good:#4ade80;--info:#60a5fa;--warn:#fbbf24;--bad:#f87171;--line:#2d335e;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#262c63 0,transparent 60%),var(--bg);color:var(--text);min-height:100vh}
header{padding:28px 20px 8px;text-align:center}
header h1{margin:0;font-size:1.8rem}
header p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px 60px}
.tabs{display:flex;gap:6px;margin:18px 0 10px;background:var(--card);padding:6px;border-radius:14px;position:sticky;top:8px;z-index:5;box-shadow:0 6px 20px #0006}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:11px 6px;border-radius:10px;font-size:.95rem;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--accent);color:#fff}
.settings{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:flex-end;margin:6px 2px 14px;color:var(--muted);font-size:.88rem}
select,input[type=datetime-local]{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.92rem;width:100%}
.settings select{width:auto}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 10px}
.card h2{font-size:1.15rem}.card h3{font-size:1.02rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--muted);font-size:.9rem}
.clock{font-size:2.6rem;font-weight:700;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums;letter-spacing:1px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:.95rem;font-weight:700;cursor:pointer;color:#fff;background:var(--card2)}
.btn.primary{background:var(--accent)}.btn.warn{background:#f59e0b;color:#1b1300}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.danger{background:#b4343f}
.btn.big{width:100%;padding:15px;font-size:1.05rem;margin-top:10px}
.btn:hover{filter:brightness(1.1)}
.f{display:block;margin-bottom:10px}.f>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.envgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
@media(max-width:560px){.envgrid{grid-template-columns:1fr}}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px}
@media(max-width:560px){.checks{grid-template-columns:1fr}}
.chk{font-size:.88rem;color:var(--text);background:var(--card2);padding:8px 10px;border-radius:8px;cursor:pointer}
.rating{display:flex;gap:8px;margin:8px 0}
.rating button{flex:1;font-size:1.6rem;padding:8px 0;border-radius:12px;border:2px solid transparent;background:var(--card2);cursor:pointer}
.rating button.sel{border-color:var(--accent);background:#2f3670}
.chip{display:inline-block;background:var(--card2);border-radius:20px;padding:3px 10px;font-size:.78rem;margin:2px 3px 2px 0;color:#d6d9ff}
.summary{display:grid;grid-template-columns:1.1fr repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:860px){.summary{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .l{color:var(--muted);font-size:.8rem}.stat .v{font-size:1.45rem;font-weight:700;margin:4px 0}.stat .s{font-size:.8rem;color:var(--muted)}
.scorecard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{--p:0;--c:var(--accent);width:110px;height:110px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),#2d335e 0)}
.ring span{width:86px;height:86px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2rem;font-weight:800}
.chartwrap{width:100%}canvas{display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.bar{background:#2d335e;border-radius:6px;height:8px;overflow:hidden;margin:4px 0}.bar>div{height:100%;border-radius:6px}
.frow{margin-bottom:12px;font-size:.88rem}.frow .top{display:flex;justify-content:space-between;gap:8px}.frow small{color:var(--muted)}
.lv{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:12px;margin-right:6px;color:#111}
.lv.good{background:var(--good)}.lv.info{background:var(--info)}.lv.warn{background:var(--warn)}.lv.bad{background:var(--bad)}
.expert{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.avatar{font-size:1.8rem;width:50px;height:50px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.expert b{display:block}.expert small{color:var(--muted)}
.fb{background:var(--card2);border-left:4px solid var(--info);border-radius:10px;padding:12px 14px;margin:10px 0}
.fb.good{border-color:var(--good)}.fb.warn{border-color:var(--warn)}.fb.bad{border-color:var(--bad)}
.fb h4{margin:0 0 6px;font-size:.98rem}.fb p{margin:0 0 6px;font-size:.9rem;line-height:1.55;color:#d9dcff}
.fb ul{margin:4px 0 0;padding-left:18px;font-size:.86rem;color:#bfc4f0;line-height:1.55}
.plan{background:linear-gradient(135deg,#2a2f69,#1f2350);border:1px solid #3b4290}
.plan ol{margin:8px 0 0;padding-left:20px;line-height:1.7;font-size:.92rem}
.note{font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.tablewrap{overflow-x:auto}
.empty{text-align:center;padding:40px 14px;color:var(--muted)}
.empty .em{font-size:2.6rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:#000d;color:#fff;padding:11px 18px;border-radius:24px;font-size:.9rem;transition:.3s;z-index:20;pointer-events:none;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
/* ===================== 반응형: 휴대폰 / 태블릿 / PC ===================== */
html{-webkit-text-size-adjust:100%}
button,select,input,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
canvas{max-width:100%;height:auto}
input[type=datetime-local]{min-width:0;max-width:100%}
.wrap{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
header{padding-top:max(28px,calc(env(safe-area-inset-top) + 14px))}
.tabs button .ic{margin-right:4px}
@media(hover:none){.btn:hover{filter:none}}

/* --- 태블릿 --- */
[data-device="tablet"]{font-size:17px}
[data-device="tablet"] .wrap{max-width:860px}
[data-device="tablet"] .card{padding:22px}
[data-device="tablet"] .tabs button{padding:14px 6px;font-size:1rem}
[data-device="tablet"] .btn{min-height:48px}
[data-device="tablet"] select,[data-device="tablet"] input[type=datetime-local]{font-size:16px;min-height:44px}
[data-device="tablet"] .chk{padding:12px 12px}
[data-device="tablet"] .rating button{min-height:58px}
[data-device="tablet"] .grid2{grid-template-columns:1fr 1fr}
[data-device="tablet"] .envgrid{grid-template-columns:repeat(3,1fr)}
[data-device="tablet"] .checks{grid-template-columns:1fr 1fr}
[data-device="tablet"] .summary{grid-template-columns:1.1fr repeat(3,1fr)}

/* --- 휴대폰 --- */
[data-device="phone"] header{padding:max(18px,calc(env(safe-area-inset-top) + 8px)) 14px 4px}
[data-device="phone"] header h1{font-size:1.4rem}
[data-device="phone"] header p{font-size:.82rem}
[data-device="phone"] .wrap{max-width:480px;padding-bottom:calc(110px + env(safe-area-inset-bottom));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
[data-device="phone"] .card{padding:14px;border-radius:14px}
[data-device="phone"] .tabs{position:fixed;top:auto;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;margin:0;gap:2px;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px #000a;z-index:30}
[data-device="phone"] .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:.72rem;min-height:52px}
[data-device="phone"] .tabs button .ic{font-size:1.3rem;line-height:1;margin:0}
[data-device="phone"] .settings{display:flex;gap:8px;justify-content:stretch;margin:12px 0}
[data-device="phone"] .settings label{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;font-size:.78rem}
[data-device="phone"] .settings select{width:100%}
[data-device="phone"] select,[data-device="phone"] input[type=datetime-local]{font-size:16px;min-height:46px}
[data-device="phone"] .btn{min-height:48px}
[data-device="phone"] .btn.big{min-height:54px}
[data-device="phone"] .row .btn{flex:1 1 auto}
[data-device="phone"] .clock{font-size:2.3rem}
[data-device="phone"] .grid2,[data-device="phone"] .envgrid,[data-device="phone"] .checks{grid-template-columns:1fr}
[data-device="phone"] .chk{padding:13px 12px;font-size:.92rem}
[data-device="phone"] .rating{gap:6px}
[data-device="phone"] .rating button{min-height:54px;font-size:1.5rem}
[data-device="phone"] .summary{grid-template-columns:1fr 1fr;gap:10px}
[data-device="phone"] .summary>.scorecard{grid-column:1/-1}
[data-device="phone"] .stat{padding:12px}
[data-device="phone"] .stat .v{font-size:1.2rem}
[data-device="phone"] .expert .avatar{width:44px;height:44px;font-size:1.5rem}
[data-device="phone"] .plan ol{padding-left:18px}
[data-device="phone"] #toast{bottom:calc(88px + env(safe-area-inset-bottom))}
/* 휴대폰: 기록 표 → 카드 목록 */
[data-device="phone"] table.hist,[data-device="phone"] table.hist tbody,[data-device="phone"] table.hist tr,[data-device="phone"] table.hist td{display:block;width:100%}
[data-device="phone"] table.hist thead{display:none}
[data-device="phone"] table.hist tr{background:var(--card2);border-radius:12px;padding:8px 12px;margin-bottom:10px}
[data-device="phone"] table.hist td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 0;text-align:right}
[data-device="phone"] table.hist td::before{content:attr(data-label);color:var(--muted);font-size:.78rem;text-align:left;flex:none}
[data-device="phone"] table.hist td:last-child{justify-content:flex-end}
[data-device="phone"] table.hist td:last-child::before{content:none}
/* 가로 모드(낮은 화면) */
@media(orientation:landscape) and (max-height:480px){
  [data-device="phone"] .tabs button{flex-direction:row;justify-content:center;gap:6px;min-height:40px;font-size:.8rem}
  [data-device="phone"] .tabs button .ic{font-size:1.05rem}
  [data-device="phone"] .wrap{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  [data-device="phone"] .grid2{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header>
  <h1>🌙 수면 패턴 분석</h1>
  <p>수면 시간을 측정하고 · 패턴을 분석하고 · 전문가 피드백을 받아보세요</p>
</header>
<div class="wrap">
  <nav class="tabs">
    <button data-tab="measure"><span class="ic">⏱</span><span class="lb">측정</span></button>
    <button data-tab="analysis"><span class="ic">📊</span><span class="lb">분석</span></button>
    <button data-tab="feedback"><span class="ic">🩺</span><span class="lb">전문가 피드백</span></button>
    <button data-tab="history"><span class="ic">🗂</span><span class="lb">기록</span></button>
  </nav>
  <div class="settings">
    <label>분석 기간 <select id="period">
      <option value="7">최근 7일</option><option value="14">최근 14일</option>
      <option value="30">최근 30일</option><option value="0">전체</option></select></label>
    <label>목표 수면 <select id="goal"></select></label>
    <label>화면 모드 <select id="device">
      <option value="auto">자동 감지</option><option value="phone">📱 휴대폰</option>
      <option value="tablet">📲 태블릿</option><option value="desktop">💻 PC</option></select></label>
  </div>
  <section id="tab-measure" class="tab"></section>
  <section id="tab-analysis" class="tab"></section>
  <section id="tab-feedback" class="tab"></section>
  <section id="tab-history" class="tab"></section>
</div>
<div id="toast"></div>

<script>
/* ===================== 유틸 / 저장소 ===================== */
const $ = (s, r = document) => r.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('sleepapp.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sleepapp.' + k, JSON.stringify(v)); } catch (e) {} }
};
let records  = store.get('records', []);
let active   = store.get('active', null);          // {start, env, end?}
let settings = Object.assign({ goal: 8, period: 14, device: 'auto' }, store.get('settings', {}));
let currentTab = 'measure';
let lastRs = [];

const H = 3.6e6;
const pad = n => String(n).padStart(2, '0');
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const sd  = a => { if (a.length < 2) return 0; const m = avg(a); return Math.sqrt(avg(a.map(x => (x - m) ** 2))); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dur   = r => (r.end - r.start) / H;
function bedH(r) { const d = new Date(r.start); let h = d.getHours() + d.getMinutes() / 60; if (h < 15) h += 24; return h; }
function wakeH(r) { const d = new Date(r.end); return d.getHours() + d.getMinutes() / 60; }
function fmtClock(h) { h = ((h % 24) + 24) % 24; let hh = Math.floor(h), mm = Math.round((h - hh) * 60); if (mm === 60) { hh = (hh + 1) % 24; mm = 0; } return pad(hh) + ':' + pad(mm); }
function fmtDur(h) { const m = Math.round(h * 60); return Math.floor(m / 60) + '시간 ' + pad(m % 60) + '분'; }
const hms = ms => { const s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
const md  = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate(); };
const fmtDT = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function toLocalInput(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }
const saveRecords = () => store.set('records', records);

/* ===================== 환경 요인 정의 ===================== */
const ENV = {
  light: { label: '수면 중 조명', def: 'dark', opts: [['dark', '완전 소등'], ['dim', '약한 취침등'], ['lamp', '스탠드/방 불 켬'], ['screen', 'TV·스마트폰 켠 채']] },
  noise: { label: '소음', def: 'quiet', opts: [['quiet', '조용함'], ['mid', '약간 있음'], ['loud', '시끄러움']] },
  temp:  { label: '실내 온도', def: 'ok', opts: [['cold', '추움'], ['ok', '적당'], ['hot', '더움']] }
};
const HABITS = [
  ['screenBefore', '📱 취침 1시간 전 스마트폰 사용'],
  ['caffeine', '☕ 오후 늦게 카페인 섭취'],
  ['alcohol', '🍺 음주'],
  ['lateMeal', '🍜 취침 3시간 내 식사·야식']
];
const FACTORS = [
  { key: 'lamp',   label: '💡 스탠드/방 불 켜고 수면', test: e => e.light === 'lamp' },
  { key: 'tv',     label: '📺 TV·스마트폰 켠 채 수면', test: e => e.light === 'screen' },
  { key: 'noise',  label: '🔊 소음 있음',              test: e => e.noise === 'mid' || e.noise === 'loud' },
  { key: 'hot',    label: '🔥 실내가 더움',            test: e => e.temp === 'hot' },
  { key: 'cold',   label: '🥶 실내가 추움',            test: e => e.temp === 'cold' },
  { key: 'screenBefore', label: '📱 취침 전 스마트폰', test: e => !!e.screenBefore },
  { key: 'caffeine', label: '☕ 늦은 카페인',          test: e => !!e.caffeine },
  { key: 'alcohol',  label: '🍺 음주',                 test: e => !!e.alcohol },
  { key: 'lateMeal', label: '🍜 야식',                 test: e => !!e.lateMeal }
];
function envFields(p) {
  const sel = k => `<label class="f"><span>${ENV[k].label}</span><select id="${p}-${k}">${ENV[k].opts.map(([v, t]) =>
    `<option value="${v}"${v === ENV[k].def ? ' selected' : ''}>${t}</option>`).join('')}</select></label>`;
  return `<div class="envgrid">${Object.keys(ENV).map(sel).join('')}</div>
    <div class="checks">${HABITS.map(([k, t]) => `<label class="chk"><input type="checkbox" id="${p}-${k}"> ${t}</label>`).join('')}</div>`;
}
function readEnv(p) {
  const o = {};
  for (const k in ENV) o[k] = $(`#${p}-${k}`).value;
  HABITS.forEach(([k]) => o[k] = $(`#${p}-${k}`).checked);
  return o;
}
function envChips(e) {
  e = e || {}; const c = [];
  if (e.light === 'dark') c.push('🌑 소등'); if (e.light === 'dim') c.push('🕯 취침등');
  if (e.light === 'lamp') c.push('💡 조명 켬'); if (e.light === 'screen') c.push('📺 화면 켬');
  if (e.noise === 'mid') c.push('🔊 약간 소음'); if (e.noise === 'loud') c.push('🔊 시끄러움');
  if (e.temp === 'hot') c.push('🔥 더움'); if (e.temp === 'cold') c.push('🥶 추움');
  if (e.screenBefore) c.push('📱'); if (e.caffeine) c.push('☕'); if (e.alcohol) c.push('🍺'); if (e.lateMeal) c.push('🍜');
  return c.map(x => `<span class="chip">${x}</span>`).join('');
}
const RATE_EMOJI = ['😫', '😕', '😐', '🙂', '😄'], RATE_TXT = ['매우 나쁨', '나쁨', '보통', '좋음', '매우 좋음'];
const ratingHTML = id => `<div class="rating" id="${id}" data-value="0">${RATE_EMOJI.map((e, i) =>
  `<button type="button" data-rate="${i + 1}" title="${RATE_TXT[i]}">${e}</button>`).join('')}</div>`;

/* ===================== 기록 추가 ===================== */
function addRecord(start, end, quality, env) {
  const d = (end - start) / H;
  if (!(end > start)) { toast('기상 시각이 취침 시각보다 늦어야 해요.'); return false; }
  if (d > 20) { toast('수면 시간이 20시간을 넘을 수 없어요.'); return false; }
  if (d < 0.25) { toast('15분 미만은 기록하지 않아요.'); return false; }
  records.push({ id: Date.now() + Math.floor(Math.random() * 1000), start, end, quality: quality || null, env });
  records.sort((a, b) => a.end - b.end);
  saveRecords();
  return true;
}

/* ===================== 분석 ===================== */
function envPenalty(e) {

  else if (q < 4) items.push(it('info', '수면의 질은 보통 수준입니다', `아침 컨디션 평균 ${q.toFixed(1)}점입니다. 환경과 습관을 한두 가지만 개선해도 점수가 오를 여지가 있어요.`));
  else items.push(it('good', '아침 컨디션이 좋습니다', `컨디션 평균 ${q.toFixed(1)}점으로 수면에 대한 만족도가 높습니다.`));

  return items;
}

  const wdwe = (a.wd && a.we) ? `

    <p class="muted" style="margin:10px 0 0">사회적 시차: <b style="color:${a.sjl >= 1.5 ? 'var(--warn)' : 'var(--good)'}">${a.sjl.toFixed(1)}시간</b>
    <span class="note">(평일과 주말 수면 중간 시각의 차이)</span></p>`
    : '<p class="muted">평일과 주말 기록이 모두 있어야 비교할 수 있어요.</p>';
  el.innerHTML = `
  <div class="summary">
    <div class="stat scorecard"><div class="l">수면 점수</div>
      <div class="ring" style="--p:${a.score};--c:${gc}"><span>${a.score}</span></div>
      <div class="v" style="color:${gc};font-size:1.1rem;margin-top:8px">${gt}</div>
      <div class="s">시간 ${a.parts.dur}/40 · 규칙 ${a.parts.reg}/25<br>컨디션 ${a.parts.qual}/20 · 환경 ${a.parts.env}/15</div></div>
    ${stat('평균 수면 시간', fmtDur(a.avgDur), `목표 ${a.goal}시간 · ${a.n}일 분석`, durCol)}

    ${stat('취침 규칙성', `±${Math.round(a.sdBed)}분`, '취침 시각 편차 (30분 이내 권장)', regCol)}
    ${stat('수면 부채', `${a.debt.toFixed(1)}시간`, `목표 ${a.goal}시간 대비 부족 합계`, debtCol)}
    ${stat('아침 컨디션', a.avgQ ? `${RATE_EMOJI[Math.round(a.avgQ) - 1]} ${a.avgQ.toFixed(1)}/5` : '-', '평균 주관 점수')}

/* ===================== 차트 ===================== */
function setupCanvas(c, h) {
  const dpr = window.devicePixelRatio || 1, w = c.parentElement.clientWidth;
  c.style.width = w + 'px'; c.style.height = h + 'px'; c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.font = '11px system-ui,sans-serif';
  return { g, w, h };
}
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const durColor = d => d < 6 ? '#f87171' : d < 7 ? '#fbbf24' : d <= 9 ? '#4ade80' : '#a78bfa';
function drawCharts() { drawDuration(lastRs); drawWindow(lastRs); }
function drawDuration(rs) {
  const c = $('#c1'); if (!c || !rs.length) return;
  const { g, w, h } = setupCanvas(c, 260), m = { l: 38, r: 10, t: 18, b: 28 };
  const pw = w - m.l - m.r, ph = h - m.t - m.b, durs = rs.map(dur);
  const maxY = Math.max(12, Math.ceil(Math.max(...durs) + 1)), y = v => m.t + ph * (1 - v / maxY);
  g.strokeStyle = '#2d335e'; g.fillStyle = '#9aa0c8'; g.textAlign = 'right'; g.textBaseline = 'middle'; g.lineWidth = 1;
  for (let v = 0; v <= maxY; v += 2) { g.beginPath(); g.moveTo(m.l, y(v)); g.lineTo(w - m.r, y(v)); g.stroke(); g.fillText(v + 'h', m.l - 6, y(v)); }
  g.fillStyle = 'rgba(74,222,128,.12)'; g.fillRect(m.l, y(9), pw, y(7) - y(9));
  g.setLineDash([5, 4]); g.strokeStyle = '#7c8cff'; g.beginPath(); g.moveTo(m.l, y(settings.goal)); g.lineTo(w - m.r, y(settings.goal)); g.stroke(); g.setLineDash([]);
  const n = rs.length, slot = pw / n, bw = Math.min(38, slot * .66), step = Math.ceil(n / 14);
  rs.forEach((r, i) => {
    const d = durs[i], x = m.l + slot * i + (slot - bw) / 2;
    g.fillStyle = durColor(d); rr(g, x, y(d), bw, y(0) - y(d), 5); g.fill();
    g.textAlign = 'center';
    if (i % step === 0) { g.fillStyle = '#9aa0c8'; g.textBaseline = 'top'; g.fillText(md(r.end), x + bw / 2, h - m.b + 8); }
    if (n <= 16) { g.fillStyle = '#eef0ff'; g.textBaseline = 'bottom'; g.fillText(d.toFixed(1), x + bw / 2, y(d) - 3); }
  });
}
function drawWindow(rs) {
  const c = $('#c2'); if (!c || !rs.length) return;
  const { g, w, h } = setupCanvas(c, 290), m = { l: 46, r: 10, t: 14, b: 28 };
  const pw = w - m.l - m.r, ph = h - m.t - m.b;
  const st = rs.map(bedH), en = rs.map((r, i) => st[i] + dur(r));
  const lo = Math.floor(Math.min(...st)) - 1, hi = Math.ceil(Math.max(...en)) + 1, y = v => m.t + ph * (v - lo) / (hi - lo);
  const stepH = (hi - lo) > 12 ? 2 : 1;
  g.strokeStyle = '#2d335e'; g.fillStyle = '#9aa0c8'; g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let v = lo; v <= hi; v += stepH) { g.beginPath(); g.moveTo(m.l, y(v)); g.lineTo(w - m.r, y(v)); g.stroke(); g.fillText(pad(((v % 24) + 24) % 24) + ':00', m.l - 6, y(v)); }
  const n = rs.length, slot = pw / n, bw = Math.min(34, slot * .62), step = Math.ceil(n / 14);
  rs.forEach((r, i) => {
    const x = m.l + slot * i + (slot - bw) / 2, grd = g.createLinearGradient(0, y(st[i]), 0, y(en[i]));
    grd.addColorStop(0, '#5b6bff'); grd.addColorStop(1, '#a78bfa');
    g.fillStyle = grd; rr(g, x, y(st[i]), bw, y(en[i]) - y(st[i]), 6); g.fill();
    g.textAlign = 'center';
    if (i % step === 0) { g.fillStyle = '#9aa0c8'; g.textBaseline = 'top'; g.fillText(md(r.end), x + bw / 2, h - m.b + 8); }
    if (n <= 10 && bw > 26) { g.fillStyle = '#fff'; g.textBaseline = 'top'; g.fillText(fmtClock(st[i]), x + bw / 2, y(st[i]) + 3); g.textBaseline = 'bottom'; g.fillText(fmtClock(en[i]), x + bw / 2, y(en[i]) - 3); }
  });
}
window.addEventListener('resize', () => { if (currentTab === 'analysis') drawCharts(); });

/* ===================== 렌더링: 전문가 피드백 ===================== */

  </div>

    ${e.items.sort((x, y) => LV_ORD[x.level] - LV_ORD[y.level]).map(i => `<div class="fb ${i.level}">
      <h4><span class="lv ${i.level}">${LV_TXT[i.level]}</span>${i.title}</h4><p>${i.text}</p>
      ${i.tips.length ? `<ul>${i.tips.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div>`).join('')}
  <p class="note">※ 이 피드백은 입력된 기록을 바탕으로 일반적인 수면 위생 지침(성인 권장 수면 7~9시간 등)에 따라 자동 생성된 참고 정보입니다. 가상의 전문가 역할로 구성되었으며 의학적 진단·치료를 대신하지 않습니다. 코골이·수면 중 호흡 정지, 심한 낮 졸음, 2주 이상 지속되는 불면이 있다면 의료기관 상담을 권장합니다.</p>`;
}

/* ===================== 렌더링: 기록 ===================== */
function renderHistory() {
  const el = $('#tab-history'), rs = [...records].sort((a, b) => b.end - a.end);
  if (!rs.length) { el.innerHTML = `<div class="card empty"><div class="em">🗂</div><p>아직 기록이 없어요.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" data-tab="measure">측정하러 가기</button><button class="btn" data-action="sample">예시 데이터 불러오기</button></div></div>`; return; }
  el.innerHTML = `<div class="card"><h2>🗂 전체 기록 (${rs.length}개)</h2>
    <div class="tablewrap"><table class="hist"><thead><tr><th>기상일</th><th>취침 → 기상</th><th>수면</th><th>컨디션</th><th>환경·습관</th><th></th></tr></thead><tbody>
    ${rs.map(r => { const d = dur(r); return `<tr><td data-label="기상일">${md(r.end)}</td><td data-label="취침 → 기상">${fmtDT(r.start)} → ${fmtDT(r.end).split(' ')[1]}</td>
      <td data-label="수면" style="color:${durColor(d)};font-weight:700">${fmtDur(d)}</td><td data-label="컨디션">${r.quality ? RATE_EMOJI[r.quality - 1] : '-'}</td>
      <td data-label="환경·습관">${envChips(r.env)}</td><td><button class="btn ghost" data-action="del" data-id="${r.id}">삭제</button></td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="row"><button class="btn" data-action="csv">⬇ CSV 내보내기</button><button class="btn" data-action="json">⬇ JSON 백업</button>
    <button class="btn danger" data-action="clear">전체 삭제</button></div></div>`;
}

/* ===================== 예시 데이터 / 내보내기 ===================== */
function makeSample() {
  let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const today = new Date(); today.setHours(0, 0, 0, 0); const out = [];
  for (let i = 13; i >= 0; i--) {
    const day = new Date(today); day.setDate(day.getDate() - i);
    const we = day.getDay() === 0 || day.getDay() === 6;
    const bedMin = (we ? 90 : 20) + (rnd() - .4) * 90, wakeMin = (we ? 570 : 390) + (rnd() - .5) * 50;
    const end = new Date(day).getTime() + wakeMin * 6e4, start = new Date(day).getTime() + bedMin * 6e4;
    if (end > Date.now()) continue;
    const lamp = rnd() < .55;
    const env = { light: lamp ? 'lamp' : (rnd() < .2 ? 'dim' : 'dark'), noise: rnd() < .2 ? 'mid' : 'quiet', temp: rnd() < .25 ? 'hot' : 'ok',
      screenBefore: rnd() < .7, caffeine: rnd() < .35, alcohol: we && rnd() < .5, lateMeal: rnd() < .3 };
    const d = (end - start) / H;
    const q = clamp(Math.round(3.6 - (lamp ? .9 : 0) - (d < 6.5 ? .6 : 0) - (env.alcohol ? .4 : 0) + (rnd() - .5)), 1, 5);
    out.push({ id: Date.now() + i, start, end, quality: q, env });
  }
  return out;
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type })), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 500);
}

/* ===================== 이벤트 ===================== */
const actions = {
  start() { active = { start: Date.now(), env: readEnv('live') }; store.set('active', active); renderMeasure(); toast('측정을 시작했어요. 편안한 밤 되세요 🌙'); },
  wake() {
    if (Date.now() - active.start < 5 * 6e4) { toast('측정 시간이 너무 짧아요. (5분 미만)'); return; }
    active.end = Date.now(); store.set('active', active); renderMeasure();
  },
  cancel() { if (confirm('측정을 취소할까요? 기록은 저장되지 않습니다.')) { active = null; store.set('active', null); renderMeasure(); } },
  saveLive() {
    const q = +$('#liveRate').dataset.value || 0;
    if (addRecord(active.start, active.end, q, active.env)) { active = null; store.set('active', null); toast('수면 기록을 저장했어요 ✅'); renderMeasure(); }
  },
  discardLive() { if (confirm('이 기록을 버릴까요?')) { active = null; store.set('active', null); renderMeasure(); } },
  addManual() {
    const s = new Date($('#m-start').value).getTime(), e = new Date($('#m-end').value).getTime();
    if (isNaN(s) || isNaN(e)) { toast('취침·기상 시각을 입력해 주세요.'); return; }
    if (addRecord(s, e, +$('#mRate').dataset.value || 0, readEnv('m'))) { toast('기록을 추가했어요 ✅'); renderMeasure(); }
  },
  sample() {
    if (records.length && !confirm('기존 기록에 예시 데이터를 추가할까요?')) return;
    records = records.concat(makeSample()).sort((a, b) => a.end - b.end); saveRecords(); toast('예시 데이터를 불러왔어요 🧪'); showTab('analysis');
  },
  del(btn) { records = records.filter(r => String(r.id) !== btn.dataset.id); saveRecords(); renderHistory(); },
  clear() { if (confirm('모든 기록을 삭제할까요? 되돌릴 수 없습니다.')) { records = []; saveRecords(); renderHistory(); toast('모두 삭제했어요.'); } },
  json() { download('sleep-records.json', JSON.stringify(records, null, 2), 'application/json'); },
  csv() {
    const rows = [['기상일', '취침', '기상', '수면시간(h)', '컨디션(1-5)', '조명', '소음', '온도', '취침전폰', '카페인', '음주', '야식']];
    records.forEach(r => { const e = r.env || {}; rows.push([md(r.end), fmtDT(r.start), fmtDT(r.end), dur(r).toFixed(2), r.quality || '', e.light, e.noise, e.temp, e.screenBefore ? 'Y' : '', e.caffeine ? 'Y' : '', e.alcohol ? 'Y' : '', e.lateMeal ? 'Y' : '']); });
    download('sleep-records.csv', '\ufeff' + rows.map(r => r.join(',')).join('\n'), 'text/csv');
  }
};
document.addEventListener('click', e => {
  const rate = e.target.closest('[data-rate]');
  if (rate) { const box = rate.parentElement; box.dataset.value = rate.dataset.rate; [...box.children].forEach(b => b.classList.toggle('sel', b === rate)); return; }
  const tab = e.target.closest('[data-tab]'); if (tab) { showTab(tab.dataset.tab); return; }
  const act = e.target.closest('[data-action]'); if (act && actions[act.dataset.action]) actions[act.dataset.action](act);
});
function render() { ({ measure: renderMeasure, analysis: renderAnalysis, feedback: renderFeedback, history: renderHistory })[currentTab](); }
function showTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
/* 설정 + 기기 감지(휴대폰/태블릿/PC) */
function detectDevice() {
  const w = window.innerWidth, smallScreen = Math.min(screen.width, screen.height) < 600;
  if (w < 640 || (smallScreen && matchMedia('(pointer:coarse)').matches)) return 'phone';
  return w < 1024 ? 'tablet' : 'desktop';
}
function applyDevice() {
  const dev = (settings.device && settings.device !== 'auto') ? settings.device : detectDevice();
  const root = document.documentElement, changed = root.dataset.device !== dev;
  root.dataset.device = dev; return changed;
}
applyDevice();
(function initSettings() {
  const g = $('#goal'); for (let v = 6; v <= 10; v += .5) g.insertAdjacentHTML('beforeend', `<option value="${v}">${v}시간</option>`);
  g.value = settings.goal; $('#period').value = settings.period; $('#device').value = settings.device || 'auto';
  g.onchange = () => { settings.goal = +g.value; store.set('settings', settings); render(); };
  $('#period').onchange = e => { settings.period = +e.target.value; store.set('settings', settings); render(); };
  $('#device').onchange = e => {
    settings.device = e.target.value; store.set('settings', settings); applyDevice();
    toast('화면 모드를 바꿨어요');
    if (currentTab === 'analysis') requestAnimationFrame(render);   // 차트 크기 다시 계산
  };
})();
/* 화면 크기·회전 변화 대응 */
let lastW = window.innerWidth, rzTimer;
function onResize() {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => {
    if (window.innerWidth === lastW) return;   // 주소창 표시/숨김으로 인한 높이 변화는 무시
    lastW = window.innerWidth; applyDevice();
    if (currentTab === 'analysis') render();   // 차트 다시 그리기
  }, 150);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
/* 실시간 시계 */
setInterval(() => {
  const c = $('#clock'); if (c) c.textContent = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  const el = $('#elapsed'); if (el && active && !active.end) el.textContent = hms(Date.now() - active.start);
}, 1000);
showTab('measure');
</script>
